name: Upstream Sync

on:
  schedule:
    - cron: "0 */6 * * *" # run every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          # PAT_TOKEN 需要 workflow 权限，才能在上游改了 .github/workflows 时直接推送。
          # 未配置时回退到 GITHUB_TOKEN，代码仍可同步，workflow 文件会留在分叉一侧。
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Merge upstream main
        env:
          HAS_PAT: ${{ secrets.PAT_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Stardm0/MoonTV.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with Stardm0/MoonTV main."
            exit 0
          fi

          git merge --no-edit upstream/main -m "merge: sync upstream"

          set +e
          push_output=$(git push origin HEAD:main 2>&1)
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          if [ "$push_status" -eq 0 ]; then
            echo "Pushed upstream sync."
            exit 0
          fi

          if ! printf '%s\n' "$push_output" | grep -q "workflows permission"; then
            echo "Push failed for a reason other than workflow file permissions."
            exit 1
          fi

          if [ "$HAS_PAT" = "true" ]; then
            echo "PAT_TOKEN is set but cannot update workflow files. Grant it the workflow scope."
            exit 1
          fi

          echo "GITHUB_TOKEN cannot update .github/workflows. Syncing code and keeping this fork's workflow files."
          echo "Add a classic PAT with the workflow scope as repository secret PAT_TOKEN to sync workflow files too."
          git checkout HEAD^1 -- .github/workflows
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "Workflow files already match this fork. Nothing left to retry."
            exit 1
          fi
          git commit -m "chore: keep fork workflows so sync can push without workflows permission"
          git push origin HEAD:main

      - name: Delete workflow runs
        if: success()
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
